name: Refresh scoreboard data

on:
  schedule:
    # Every 10 minutes Mon–Fri, 08:00–18:00 South Africa time (06:00–16:00 UTC)
    - cron: "*/10 6-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Recompute scoreboard data from the team Google Sheets
        run: python scoreboard_pipeline.py

      - name: Publish updated data
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "scoreboard-bot@users.noreply.github.com"
          git add scoreboard.json
          git diff --cached --quiet || git commit -m "Update scoreboard data"
          git push
